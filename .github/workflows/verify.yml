name: Verify LifeApp
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-lifeapp-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Prepare isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/lifeapp-browser" --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/lifeapp-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check compiled mobile installation flow
        env:
          LIFEAPP_BROWSER_TOOLS: ${{ runner.temp }}/lifeapp-browser
        run: node scripts/pwa-browser-check.mjs
